# Codemagic: build the Godelicious iPhone app and upload it to TestFlight / App Store Connect.
# Put this file in the root of the GodeliciousApp repository (next to package.json).
#
# Signing is fully automatic: each build asks Apple for the App Store certificate and
# provisioning profile for in.godelicious.app and creates them if they don't exist.
# One-time setup in Codemagic > GodeliciousApp > Environment variables:
#   group "ios_signing_key", variable CERTIFICATE_PRIVATE_KEY (Secret) = the whole text of
#   the private key file you generate with ssh-keygen (see the setup steps).
workflows:
  ios-release:
    name: Godelicious iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must match the API key name in Codemagic > Settings > Integrations > Developer Portal.
      app_store_connect: kunal Harshaa Jadhav
    environment:
      groups:
        - ios_signing_key
      vars:
        BUNDLE_ID: "in.godelicious.app"
        XCODE_WORKSPACE: "ios/GodeliciousApp.xcworkspace"
        XCODE_SCHEME: "GodeliciousApp"
        # 10-digit "Apple ID" of the app: App Store Connect > your app > App Information
        APP_STORE_APPLE_ID: 6823355364
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm packages
        script: npm install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Get or create the App Store certificate and profile
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number (one higher than the last upload)
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          LATEST=${LATEST:-0}; TF=${TF:-0}
          [ "$TF" -gt "$LATEST" ] 2>/dev/null && LATEST=$TF
          agvtool new-version -all $((LATEST + 1))
      - name: Build the .ipa
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
